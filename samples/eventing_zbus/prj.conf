CONFIG_CONSOLE=y
CONFIG_PRINTK=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_SIMULATOR=y

CONFIG_ZEPHYRDB=y
CONFIG_ZDB_KV=y
CONFIG_ZDB_KV_BACKEND_ZMS=y
CONFIG_ZMS=y
CONFIG_NVS=n

# TS and DOC both store through a filesystem. Without LittleFS mounted the
# sample still builds but skips most of what it exists to show, so the board
# overlay supplies an /lfs partition and these select the backend for it.
CONFIG_ZDB_TS=y
CONFIG_ZDB_TS_BACKEND_LITTLEFS=y
CONFIG_ZDB_DOC=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FMP_DEV=y

CONFIG_ZDB_STATS=y

CONFIG_ZDB_EVENTING=y
CONFIG_ZDB_EVENTING_ZBUS=y
CONFIG_ZBUS=y

CONFIG_CRC=y

CONFIG_HEAP_MEM_POOL_SIZE=32768
