CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_LOG=n

CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_FCB=y
CONFIG_CRC=y

CONFIG_HEAP_MEM_POOL_SIZE=16384

CONFIG_ZEPHYRDB=y
CONFIG_ZDB_SHELL=y
CONFIG_ZDB_STATS=y

# TS only: the FCB backend owns the flash area, and this scenario is about
# which time-series commands the backend can and cannot serve.
CONFIG_ZDB_KV=n
CONFIG_ZDB_DOC=n
CONFIG_ZDB_TS=y
CONFIG_ZDB_TS_BACKEND_FCB=y
CONFIG_ZDB_TS_FCB_FLASH_AREA_ID=0
CONFIG_ZDB_TS_FCB_SECTOR_COUNT=4
