name: ZephyrDB Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  # Keep in sync with west.yml.
  ZEPHYR_REVISION: v4.4.1

jobs:
  native_sim_tests:
    name: Test suites (native_sim)
    runs-on: ubuntu-latest
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: host

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Zephyr workspace
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386

        python3 -m pip install --user --upgrade pip
        python3 -m pip install --user west
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

        west init -m https://github.com/zephyrproject-rtos/zephyr \
          --mr "$ZEPHYR_REVISION" .west-zephyr
        cd .west-zephyr
        west update --narrow -o=--depth=1
        west zephyr-export
        python3 -m pip install --user -r zephyr/scripts/requirements.txt

        echo "ZEPHYR_BASE=$GITHUB_WORKSPACE/.west-zephyr/zephyr" >> "$GITHUB_ENV"

    - name: Run test suites (native_sim)
      run: |
        python3 "$ZEPHYR_BASE/scripts/twister" -T tests -p native_sim -v --inline-logs

    - name: Build and run samples (native_sim)
      run: |
        python3 "$ZEPHYR_BASE/scripts/twister" -T samples -p native_sim -v --inline-logs

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-native-sim
        path: twister-out/
        retention-days: 14

  hardware_build:
    name: Hardware build gate (nRF52840 DK)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Zephyr workspace
      run: |
        python3 -m pip install --user --upgrade pip
        python3 -m pip install --user west
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"

        west init -m https://github.com/zephyrproject-rtos/zephyr \
          --mr "$ZEPHYR_REVISION" .west-zephyr
        cd .west-zephyr
        west update --narrow -o=--depth=1
        west zephyr-export
        python3 -m pip install --user -r zephyr/scripts/requirements.txt

        echo "ZEPHYR_BASE=$GITHUB_WORKSPACE/.west-zephyr/zephyr" >> "$GITHUB_ENV"

    - name: Install Zephyr SDK (arm-zephyr-eabi)
      run: |
        cd "$GITHUB_WORKSPACE/.west-zephyr"
        west sdk install -t arm-zephyr-eabi

    - name: Build hardware tests for nRF52840dk
      run: |
        python3 "$ZEPHYR_BASE/scripts/twister" -T tests/hardware \
          -p nrf52840dk/nrf52840 -v --inline-logs

    - name: How to run on real hardware
      run: |
        echo "The hardware suite is build-only in CI. To execute on a board:"
        echo "  twister -T tests/hardware -p nrf52840dk/nrf52840 \\"
        echo "          --device-testing --device-serial /dev/ttyACM0"

  test_summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [native_sim_tests, hardware_build]
    if: always()

    steps:
    - name: Check test status
      run: |
        echo "native_sim suites: ${{ needs.native_sim_tests.result }}"
        echo "hardware build:    ${{ needs.hardware_build.result }}"
        echo "Details: see the twister-out artifact on the native_sim job."
        if [ "${{ needs.native_sim_tests.result }}" != "success" ] || \
           [ "${{ needs.hardware_build.result }}" != "success" ]; then
          exit 1
        fi
