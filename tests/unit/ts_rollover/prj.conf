CONFIG_ZTEST=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_SIMULATOR=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FMP_DEV=y
CONFIG_CRC=y

CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_ZEPHYRDB=y
CONFIG_ZDB_KV=n
CONFIG_ZDB_TS=y
CONFIG_ZDB_TS_BACKEND_LITTLEFS=y
CONFIG_ZDB_STATS=y

# Small segments so rollover is reachable in a test: 10 records per
# segment, three segments retained.
CONFIG_ZDB_TS_ROLLOVER=y
CONFIG_ZDB_TS_ROLLOVER_SEGMENT_BYTES=280
CONFIG_ZDB_TS_ROLLOVER_MAX_SEGMENTS=3
# Flush a whole segment at a time so segment boundaries land predictably.
CONFIG_ZDB_TS_INGEST_SLAB_BLOCK_SIZE=280
CONFIG_ZDB_TS_INGEST_BUFFER_BYTES=280
