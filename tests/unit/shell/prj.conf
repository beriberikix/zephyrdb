CONFIG_ZTEST=y
# shell_execute_cmd() runs the handler in the calling thread, so the command
# handlers use the ztest thread's stack here, not CONFIG_SHELL_STACK_SIZE.
CONFIG_ZTEST_STACK_SIZE=4096

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_SERIAL=n
# The default is 300 bytes; a document dump or a ts read exceeds that and the
# tail would be dropped before the assertions ever saw it.
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_LOG=n

# "zdb ts agg" and the f64 document commands print doubles.
CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_SIMULATOR=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FMP_DEV=y
CONFIG_CRC=y

# The KV key index and every document field come from this pool.
CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_ZEPHYRDB=y
CONFIG_ZDB_SHELL=y
CONFIG_ZDB_STATS=y

CONFIG_ZDB_KV=y
CONFIG_ZDB_KV_BACKEND_ZMS=y
CONFIG_ZMS=y

CONFIG_ZDB_TS=y
CONFIG_ZDB_TS_BACKEND_LITTLEFS=y
# Left at the default of 1 on purpose: the suite proves every command opens and
# closes its stream inside one invocation.

# Not enabled by default (see Kconfig.zephyrdb).
CONFIG_ZDB_DOC=y
