CONFIG_ZTEST=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_SIMULATOR=y

# zdb_kv_ctx (RAM key index) is k_calloc'd and ~13 KB with default bounds.
CONFIG_HEAP_MEM_POOL_SIZE=32768

CONFIG_ZEPHYRDB=y
CONFIG_ZDB_KV=y
CONFIG_ZDB_KV_BACKEND_ZMS=y
CONFIG_ZMS=y
CONFIG_ZDB_TS=n
CONFIG_ZDB_EVENTING=y

# A small index so the "stored but not enumerable" bound is reachable in a
# test without writing 128 keys first.
CONFIG_ZDB_KV_INDEX_MAX_ENTRIES=16
