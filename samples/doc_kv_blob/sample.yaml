sample:
  name: ZephyrDB document-as-KV-blob sample

common:
  tags:
    - zephyrdb
    - samples
    - kv
  integration_platforms:
    - native_sim

tests:
  zephyrdb.samples.doc_kv_blob:
    harness: console
    harness_config:
      type: multi_line
      regex:
        - "doc_kv_blob: seeded settings v2"
        - "doc_kv_blob: upgraded v1 record to v2"
        - "doc_kv_blob: factory reset restored defaults"
        - "doc_kv_blob: PASS"
    platform_allow:
      - native_sim
    timeout: 20
